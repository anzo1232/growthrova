<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growthrova</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050a12;color:#fff;color-scheme:dark}
main{min-height:100svh;display:grid;place-items:center;position:relative;overflow:hidden}
canvas{display:block;max-width:100%;max-height:100svh;width:auto;height:auto}
button{position:absolute;bottom:16px;right:16px;padding:12px;min-height:44px;color:#fff;background:#050a12;border:1px solid #77d4ff;border-radius:4px;cursor:pointer}
button:focus-visible{outline:2px solid #ff4cab;outline-offset:3px}
#status:empty{display:none}
</style>

</head>
<body>
<main aria-label="Growthrova hero">
<canvas id="view" role="img" aria-label="Portrait rendered as animated sky-blue, white and hot-pink hexadecimal characters"></canvas>
<button type="button" id="pause" aria-pressed="false">Pause motion</button>
<p id="status" role="status"></p>
</main>
<script>
'use strict';
const preset = {
  renderMode:'hexdump',bgMode:'solid',bgBlur:12,bgOpacity:100,cellSize:12,coverage:93,invert:false,
  styleBlend:'source-over',charSet:'binary',customChars:'',brightness:0,contrast:115,edgeEmphasis:40,density:0,
  toneCurve:[{x:0,y:0},{x:1,y:1}],tint:'#77D4FF',tintOpacity:45,overlayBlend:'overlay',saturation:100,grayscale:0,
  blurType:'off',blurAmount:35,blurAngle:0,directionalBothSides:false,tiltFocus:35,tiltPosition:50,tiltFeather:15,
  lensFocus:40,blurCenterX:50,blurCenterY:50,progressivePosition:55,progressiveReverse:false,
  pfx:{
    vignette:{enabled:true,intensity:38},scanLines:{enabled:true,intensity:28},chromatic:{enabled:true,intensity:40},
    bloom:{enabled:true,intensity:60},filmGrain:{enabled:true,intensity:40},glitch:{enabled:true,intensity:20},
    pixelate:{enabled:false,intensity:15},halftone:{enabled:false,intensity:20},filmDust:{enabled:false,intensity:20}
  },
  animated:true,animStyle:'flicker',animSpeed:{enabled:true,intensity:100},animIntensity:{enabled:true,intensity:60},
  lights:{enabled:false,points:[]},
  mask:{enabled:false,tool:'freehand',brushSize:30,showOverlay:false,invert:false,dataUrl:null,shapes:[]}
};
const modes = 'characters dither mosaic pixel dots cross diamond voxel lego mixed lines diagonal braille disco hexdump matrix rings hearts stars hexagons triangles bubbles hatch contour halfblocks'.split(' ');
const ramps = {binary:'01',classic:' .:-=+*#%@',blocks:' ░▒▓█',numbers:'0123456789'};
const byId = id => document.getElementById(id);
const view = byId('view');
const ctx = view.getContext('2d');
const createCanvas = () => document.createElement('canvas').getContext('2d');
const source = createCanvas(), layer = createCanvas(), temp = createCanvas(), scratch = createCanvas(), maskLayer = createCanvas();
const clamp = (n,min=0,max=1) => Math.min(max,Math.max(min,n));
const luminance = (r,g,b) => (r*.2126+g*.7152+b*.0722)/255;
function noise(x,y,seed=0) {
  let value = Math.imul(x+1,374761393)^Math.imul(y+1,668265263)^Math.imul(seed+1,2246822519);
  value = Math.imul(value^(value>>>13),1274126177);
  return ((value^(value>>>16))>>>0)/4294967296;
}
function tone(value,curve) {
  if (!curve?.length) return value;
  for (let i=1;i<curve.length;i++) {
    const a=curve[i-1], b=curve[i];
    if (value<=b.x) return a.y+(b.y-a.y)*clamp((value-a.x)/Math.max(.00001,b.x-a.x));
  }
  return curve.at(-1).y;
}

let settings=structuredClone(preset), photo, maskImage, maskVersion=0, cells=[], width=0, height=0;
let original=false, paused=matchMedia('(prefers-reduced-motion: reduce)').matches, dirty=true, elapsed=0, last=0;
function fitPhoto() {
  const scale=Math.min(1,840/photo.naturalWidth,840/photo.naturalHeight);
  width=Math.max(1,Math.round(photo.naturalWidth*scale));
  height=Math.max(1,Math.round(photo.naturalHeight*scale));
  for (const canvas of [view,...[source,layer,temp,scratch,maskLayer].map(c=>c.canvas)]) {
    canvas.width=width;
    canvas.height=height;
  }
  source.drawImage(photo,0,0,width,height);
  sample();
}
function sample() {
  const data=source.getImageData(0,0,width,height).data;
  const step=clamp(Math.round(settings.cellSize),2,128);
  const columns=Math.ceil(width/step), rows=Math.ceil(height/step);
  cells=[];
  for (let row=0;row<rows;row++) for (let col=0;col<columns;col++) {
    const x=col*step,y=row*step,w=Math.min(step,width-x),h=Math.min(step,height-y);
    let r=0,g=0,b=0,top=0,bottom=0,topCount=0,bottomCount=0;
    for (let j=0;j<h;j++) for (let i=0;i<w;i++) {
      const p=((y+j)*width+x+i)*4;
      r+=data[p];g+=data[p+1];b+=data[p+2];
      const l=luminance(data[p],data[p+1],data[p+2]);
      if(j<Math.ceil(h/2)){top+=l;topCount++;}else{bottom+=l;bottomCount++;}
    }
    const n=w*h, l=luminance(r/n,g/n,b/n);
    cells.push({x:x+w/2,y:y+h/2,size:Math.min(w,h),row,col,r:r/n,g:g/n,b:b/n,l,top:top/topCount,bottom:bottomCount?bottom/bottomCount:l});
  }
  cells.forEach((cell,i)=>{
    const right=cell.col+1<columns?cells[i+1].l:cell.l;
    const down=cell.row+1<rows?cells[i+columns].l:cell.l;
    cell.edge=Math.hypot(cell.l-right,cell.l-down);
    cell.corners=[cell.l,right,cell.row+1<rows&&cell.col+1<columns?cells[i+columns+1].l:down,down];
  });
  dirty=true;
}
function polygon(c,n,r,angle=-Math.PI/2,inner=r) {
  c.beginPath();
  const count=inner===r?n:n*2;
  for(let i=0;i<count;i++) {
    const a=angle+i*Math.PI*2/count, distance=i%2?inner:r;
    c.lineTo(Math.cos(a)*distance,Math.sin(a)*distance);
  }
  c.closePath();
  c.fill();
}
function circle(c,x,y,r,stroke=false) {
  c.beginPath();c.arc(x,y,Math.max(.2,r),0,Math.PI*2);
  if(stroke)c.stroke();else c.fill();
}
function line(c,x,y,u,v) {
  c.beginPath();c.moveTo(x,y);c.lineTo(u,v);c.stroke();
}
function drawCell(c,cell,value,time,chars,mode) {
  const {col,row,size}=cell;
  const random=noise(col,row);
  if (mode==='mixed') mode=['dots','cross','diamond','rings','triangles'][Math.floor(random*5)];
  const r=size*(.14+value*.34), span=r*2;
  const glyph=sequence=>{
    c.font='700 '+Math.max(2,size*(.62+value*.37))+'px monospace';
    c.textAlign='center';c.textBaseline='middle';
    c.fillText(sequence[Math.min(sequence.length-1,Math.floor(value*sequence.length))],0,0,size);
  };
  c.lineWidth=Math.max(.65,size*.075);
  switch(mode){
    case 'characters': glyph(chars);break;
    case 'hexdump': {
      const digits='0123456789ABCDEF';
      const index=clamp(Math.floor(value*16),0,15);
      const digit=noise(col,row,Math.floor(time*7))>.95?Math.floor(random*16):index;
      glyph([digits[digit]]);break;
    }
    case 'matrix': {
      const phase=((row-time*(4+noise(col,0)*9))%28+28)%28;
      c.globalAlpha*=Math.max(.14,1-phase/22);
      c.fillStyle=phase<2?'#b6ffd0':'#17f965';
      glyph(['0123456789ABCDEF'[Math.floor(noise(col,row,Math.floor(time*4))*16)]]);break;
    }
    case 'dither': {
      const bayer=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
      if(value>bayer[(row%4)*4+col%4]/16)c.fillRect(-size/2,-size/2,size,size);
      break;
    }
    case 'mosaic': c.fillRect(-size*.46,-size*.46,size*.92,size*.92);break;
    case 'pixel': c.fillRect(-r,-r,span,span);break;
    case 'dots': circle(c,0,0,r);break;
    case 'cross': line(c,-r,0,r,0);line(c,0,-r,0,r);break;
    case 'diamond': polygon(c,4,r);break;
    case 'voxel': {
      c.globalAlpha*=.62;c.fillRect(-r,-r*.5,span,r*1.45);
      c.globalAlpha/=.62;c.translate(0,-r*.46);c.scale(1,.52);polygon(c,4,r*1.25);break;
    }
    case 'lego': c.fillRect(-r,-r,span,span);c.fillStyle='#ffffff88';circle(c,0,0,r*.44);break;
    case 'lines': line(c,-r,0,r,0);break;
    case 'diagonal': line(c,-r,r,r,-r);break;
    case 'braille':
      for(let j=0;j<4;j++)for(let i=0;i<2;i++)
        if(noise(col*2+i,row*4+j)<value)circle(c,(i-.5)*size*.32,(j-1.5)*size*.2,size*.065);
      break;
    case 'disco': c.rotate(Math.PI/4);c.fillRect(-r*.77,-r*.77,r*1.54,r*1.54);c.fillStyle='#fff9';circle(c,-r*.22,-r*.22,r*.22);break;
    case 'rings': circle(c,0,0,r,true);break;
    case 'hearts':
      c.beginPath();c.moveTo(0,r);c.bezierCurveTo(-r*2,-r*.25,-r*.65,-r*1.5,0,-r*.5);
      c.bezierCurveTo(r*.65,-r*1.5,r*2,-r*.25,0,r);c.fill();break;
    case 'stars': polygon(c,5,r,-Math.PI/2,r*.43);break;
    case 'hexagons': polygon(c,6,size*.54,0);break;
    case 'triangles': polygon(c,3,size*.57,(row+col)%2?Math.PI/2:-Math.PI/2);break;
    case 'bubbles': circle(c,0,0,r,true);c.fillStyle='#fff9';circle(c,-r*.31,-r*.32,r*.2);break;
    case 'hatch':
      for(let i=0;i<Math.ceil(value*4);i++){const o=(i-1.5)*r*.37;line(c,-r+o*.3,r+o*.3,r+o*.3,-r+o*.3);}
      if(value>.55)line(c,-r,-r,r,r);
      break;
    case 'contour': {
      const corners=[[-size/2,-size/2],[size/2,-size/2],[size/2,size/2],[-size/2,size/2]];
      const values=cell.corners.map(l=>tone(settings.invert?1-l:l,settings.toneCurve));
      for(let level=.1;level<1;level+=.1){
        const points=[];
        for(let i=0;i<4;i++){
          const j=(i+1)%4;
          if((values[i]<level)===(values[j]<level))continue;
          const fraction=(level-values[i])/(values[j]-values[i]);
          points.push(corners[i].map((coord,axis)=>coord+(corners[j][axis]-coord)*fraction));
        }
        if(points.length===4&&(values.reduce((sum,n)=>sum+n,0)/4<level)===(values[0]<level))points.push(points.shift());
        for(let i=0;i<points.length;i+=2)line(c,...points[i],...points[i+1]);
      }
      break;
    }
    case 'halfblocks':
      c.globalAlpha*=clamp(settings.invert?1-cell.top:cell.top);c.fillRect(-size/2,-size/2,size,size/2);
      c.globalAlpha=(settings.invert?1-cell.bottom:cell.bottom);c.fillRect(-size/2,0,size,size/2);
      break;
  }
}
function motion(cell,t,strength) {
  const {x,y,col,row}=cell;
  switch(settings.animStyle){
    case 'wave': return Math.sin(x*.025+y*.012-t*6)*strength;
    case 'pulse': return Math.sin(t*5)*strength;
    case 'shimmer': return Math.pow(Math.max(0,Math.sin(x*.06+y*.025-t*10)),9)*strength;
    case 'ripple': return Math.sin(Math.hypot(x-width/2,y-height/2)*.052-t*8)*strength;
    case 'flicker': return (noise(col,row,Math.floor(t*16))-.5)*strength*1.3;
    default:return 0;
  }
}
function clear(c){c.clearRect(0,0,width,height);}
function copy(c,from){clear(c);c.drawImage(from.canvas,0,0);}
function filterCopy(c,from,filter){
  clear(c);c.save();c.filter=filter;c.drawImage(from.canvas,0,0);c.restore();
}
function applyBlur(s) {
  if(s.blurType==='off'||!s.blurAmount)return;
  copy(temp,ctx);
  const amount=s.blurAmount*.32;
  if(s.blurType==='directional'||s.blurType==='motion'){
    const angle=s.blurAngle*Math.PI/180;
    clear(ctx);
    for(let i=0;i<=8;i++){
      const offset=(i/8-(s.directionalBothSides?.5:0))*amount*2;
      ctx.globalAlpha=1/(i+1);
      ctx.drawImage(temp.canvas,Math.cos(angle)*offset,Math.sin(angle)*offset);
    }
    ctx.globalAlpha=1;
    return;
  }
  filterCopy(scratch,temp,'blur('+amount+'px)');
  if(!['tilt','tilt-shift','lens','progressive'].includes(s.blurType)){copy(ctx,scratch);return;}
  const blurred=scratch.getImageData(0,0,width,height), sharp=temp.getImageData(0,0,width,height);
  const cx=s.blurCenterX/100,cy=s.blurCenterY/100;
  for(let y=0;y<height;y++)for(let x=0;x<width;x++){
    const u=x/width,v=y/height;
    let a=clamp((Math.abs(v-s.tiltPosition/100)-s.tiltFocus/200)/Math.max(.01,s.tiltFeather/100));
    if(s.blurType==='lens')a=clamp((Math.hypot(u-cx,v-cy)-s.lensFocus/200)*4);
    if(s.blurType==='progressive')a=clamp((s.progressiveReverse?s.progressivePosition/100-v:v-s.progressivePosition/100)*2);
    const i=(y*width+x)*4;
    for(let channel=0;channel<4;channel++)sharp.data[i+channel]+=(blurred.data[i+channel]-sharp.data[i+channel])*a;
  }
  ctx.putImageData(sharp,0,0);
}
const effects={
  vignette(a){
    const gradient=ctx.createRadialGradient(width/2,height/2,Math.min(width,height)*.18,width/2,height/2,Math.hypot(width,height)*.5);
    gradient.addColorStop(0,'#0000');gradient.addColorStop(1,'rgba(0,0,0,'+a+')');
    ctx.fillStyle=gradient;ctx.fillRect(0,0,width,height);
  },
  scanLines(a){
    ctx.fillStyle='rgba(0,0,0,'+a+')';
    for(let y=0;y<height;y+=4)ctx.fillRect(0,y,width,1);
  },
  chromatic(a){
    copy(temp,ctx);
    ctx.globalCompositeOperation='screen';ctx.globalAlpha=a*.48;
    for(const [color,shift] of [['#ffffff',-1],['#77d4ff',1]]){
      copy(scratch,temp);
      scratch.globalCompositeOperation='multiply';scratch.fillStyle=color;scratch.fillRect(0,0,width,height);
      scratch.globalCompositeOperation='source-over';
      ctx.drawImage(scratch.canvas,shift*a*6,0);
    }
  },
  bloom(a){
    filterCopy(temp,ctx,'blur('+Math.max(1,a*9)+'px)');
    ctx.globalCompositeOperation='screen';ctx.globalAlpha=a*.62;ctx.drawImage(temp.canvas,0,0);
  },
  filmGrain(a,t){
    ctx.globalAlpha=a*.23;
    const seed=Math.floor(t*20);
    for(let i=0;i<width*height/100;i++){
      ctx.fillStyle=i%2?'#eaf8ff':'#000';
      ctx.fillRect(noise(i,1,seed)*width,noise(i,2,seed)*height,1.25,1.25);
    }
  },
  glitch(a,t){
    const tick=Math.floor(t*10);
    if(noise(0,0,tick)>a*.65)return;
    copy(temp,ctx);
    for(let i=0;i<3;i++){
      const y=Math.floor(noise(i,4,tick)*Math.max(1,height-2));
      const h=Math.min(height-y,2+Math.floor(noise(i,5,tick)*height*.04));
      const shift=(noise(i,6,tick)-.5)*a*width*.25;
      ctx.clearRect(0,y,width,h);ctx.drawImage(temp.canvas,0,y,width,h,shift,y,width,h);
    }
  },
  halftone(a){
    ctx.strokeStyle='#000';ctx.globalAlpha=a*.65;
    for(let y=2;y<height;y+=7)for(let x=2;x<width;x+=7)circle(ctx,x,y,1.3,true);
  },
  pixelate(a){
    const factor=1+Math.round(a*16),w=Math.max(1,Math.floor(width/factor)),h=Math.max(1,Math.floor(height/factor));
    clear(temp);temp.drawImage(view,0,0,w,h);clear(ctx);
    ctx.imageSmoothingEnabled=false;ctx.drawImage(temp.canvas,0,0,w,h,0,0,width,height);
  },
  filmDust(a,t){
    ctx.globalAlpha=a*.65;ctx.fillStyle='#e9e5d2';
    for(let i=0;i<a*35;i++){
      const seed=Math.floor(t*7);
      ctx.fillRect(noise(i,9,seed)*width,noise(i,8,seed)*height,1+noise(i,7,seed)*2,1.5);
    }
  }
};
function render(t) {
  clear(ctx);
  if(original){ctx.drawImage(source.canvas,0,0);return;}
  const s=settings;
  const step=clamp(Math.round(s.cellSize),2,128);
  const strength=s.animIntensity.enabled?s.animIntensity.intensity/100:0;
  const chars=Array.from(s.customChars||ramps[s.charSet]||s.charSet||ramps.classic);
  clear(layer);
  layer.save();
  layer.globalAlpha=clamp(s.bgOpacity/100);
  if(s.bgMode==='solid'){
    layer.fillStyle=s.bgColor||'#050a12';layer.fillRect(0,0,width,height);
  }else if(s.bgMode==='original'||s.bgMode==='blurred'||s.bgMode==='blur'){
    if(s.bgMode!=='original')layer.filter='blur('+s.bgBlur+'px)';
    layer.drawImage(source.canvas,0,0);
  }
  layer.restore();
  layer.globalCompositeOperation=s.styleBlend;
  for(const cell of cells){
    if(noise(cell.col,cell.row,41)>=s.coverage/100)continue;
    let value=tone(s.invert?1-cell.l:cell.l,s.toneCurve);
    value=clamp(value+cell.edge*s.edgeEmphasis/100+s.density/100);
    const shift=s.animated?motion(cell,t,strength):0;
    layer.save();
    layer.translate(cell.x,cell.y);
    layer.globalAlpha=clamp(.08+value*.92+shift*.3);
    if(s.renderMode==='hexdump'){
      const white=clamp((value-.56)/.44);
      const color=noise(cell.col,cell.row,97)<.03?[255,76,171]:
        [119+136*white,212+43*white,255];
      layer.fillStyle='rgb('+color.map(Math.round).join(',')+')';

    }else{
      const lift=value*45;
      layer.fillStyle='rgb('+Math.min(255,Math.round(cell.r+lift))+','+Math.min(255,Math.round(cell.g+lift))+','+Math.min(255,Math.round(cell.b+lift))+')';
    }
    layer.strokeStyle=layer.fillStyle;
    drawCell(layer,cell,clamp(value+shift*.12),t,chars,s.renderMode);
    layer.restore();
  }
  layer.globalCompositeOperation='source-over';
  filterCopy(ctx,layer,'brightness('+Math.max(0,100+s.brightness)+'%) contrast('+s.contrast+'%) saturate('+s.saturation+'%) grayscale('+s.grayscale+'%)');
  if(s.tintOpacity){
    // Mask the tint to the composited artwork so a transparent background stays transparent.
    copy(temp,ctx);
    temp.globalCompositeOperation='source-in';temp.fillStyle=s.tint;temp.fillRect(0,0,width,height);
    temp.globalCompositeOperation='source-over';
    ctx.save();ctx.globalAlpha=s.tintOpacity/100;ctx.globalCompositeOperation=s.overlayBlend;ctx.drawImage(temp.canvas,0,0);ctx.restore();
  }
  applyBlur(s);
  for(const [key,option] of Object.entries(s.pfx)){
    if(option.enabled&&option.intensity>0&&effects[key]){
      ctx.save();effects[key](clamp(option.intensity/100),t);ctx.restore();
    }
  }
  if(s.lights.enabled){
    ctx.save();ctx.globalCompositeOperation='screen';
    for(const point of s.lights.points){
      const x=point.x*width,y=point.y*height;
      const radius=Math.max(1,point.radius*(point.radius<=1?Math.min(width,height):1));
      const gradient=ctx.createRadialGradient(x,y,0,x,y,radius);
      gradient.addColorStop(0,point.color||'#c7ffcf');gradient.addColorStop(1,'#c7ffcf00');
      ctx.globalAlpha=clamp(point.intensity/(point.intensity>1?100:1));
      ctx.fillStyle=gradient;ctx.fillRect(x-radius,y-radius,radius*2,radius*2);
    }
    ctx.restore();
  }
  if(s.mask.enabled&&maskImage){
    copy(temp,source);
    temp.globalCompositeOperation=s.mask.invert?'destination-out':'destination-in';
    temp.drawImage(maskLayer.canvas,0,0);
    temp.globalCompositeOperation='source-over';ctx.drawImage(temp.canvas,0,0);
  }

}
function frame(now){
  const moving=!paused&&(settings.animated||settings.renderMode==='matrix')&&!original;
  if(photo&&width&&(dirty||(moving&&now-last>=48))){
    if(moving&&last)elapsed+=Math.min(90,now-last)/1000;
    last=now;
    render(elapsed*(settings.animSpeed.enabled?settings.animSpeed.intensity/100:1));
    dirty=false;
  }
  requestAnimationFrame(frame);
}
function loadImage(url){
  return new Promise((resolve,reject)=>{
    const image=new Image();image.onload=()=>resolve(image);
    image.onerror=()=>reject(new Error('This image could not be opened.'));
    image.src=url;
  });
}
function prepareMask(){
  clear(maskLayer);
  if(!maskImage)return;
  maskLayer.drawImage(maskImage,0,0,width,height);
  const pixels=maskLayer.getImageData(0,0,width,height);
  let transparency=false;
  for(let i=3;i<pixels.data.length;i+=4)if(pixels.data[i]<255){transparency=true;break;}
  // Transparent paint masks use alpha. Opaque grayscale masks use luminance.
  if(!transparency){
    for(let i=0;i<pixels.data.length;i+=4)pixels.data[i+3]=255*luminance(...pixels.data.subarray(i,i+3));
    maskLayer.putImageData(pixels,0,0);
  }
}
async function setPhoto(url){
  photo=await loadImage(url);fitPhoto();prepareMask();
}
async function configure(overrides){
  const update=structuredClone(overrides);
  const previousMask=settings.mask.dataUrl;
  const previousSize=settings.cellSize;
  for(const key of ['pfx','lights','mask','animSpeed','animIntensity']){
    if(update[key])update[key]={...settings[key],...update[key]};
  }
  if(update.pfx){
    for(const key of Object.keys(settings.pfx))update.pfx[key]={...settings.pfx[key],...update.pfx[key]};
  }
  Object.assign(settings,update);
  if(width&&settings.cellSize!==previousSize)sample();
  dirty=true;
  if(settings.mask.dataUrl!==previousMask){
    const version=++maskVersion;
    const image=settings.mask.dataUrl?await loadImage(settings.mask.dataUrl):null;
    if(version===maskVersion){maskImage=image;if(width)prepareMask();dirty=true;}
  }
}
