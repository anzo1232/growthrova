<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Growthrova</title>
<style>
:root{color-scheme:dark;background:#050a12;color:#fff}
*{box-sizing:border-box}body{margin:0}
main{position:relative;display:grid;place-items:center;min-height:100svh;isolation:isolate;background:radial-gradient(ellipse at 52% 49%,#10253e 0%,#091321 33%,#050a12 72%)}
canvas{display:block;width:min(100%,1500px);height:auto;aspect-ratio:2.4}
button{position:absolute;right:clamp(16px,4vw,56px);bottom:24px;min-width:44px;min-height:44px;background:#091321;color:#d9f3ff;border:1px solid #77d4ff54;border-radius:50%;font:18px monospace;cursor:pointer}
button:focus-visible{outline:2px solid #ff4cab;outline-offset:4px}
@media(max-width:600px){canvas{aspect-ratio:1.25}}
</style>
</head>
<body>
<main aria-label="Growthrova hero">
<canvas id="art" role="img" aria-label="Growthrova formed from hundreds of miniature wordmarks that separate in a wave and reassemble"></canvas>
<button id="motion" type="button" aria-label="Pause animation" aria-pressed="false">Ⅱ</button>
</main>
<script>
'use strict';
const canvas=document.getElementById('art');
const button=document.getElementById('motion');
const ctx=canvas.getContext('2d');
const layer=document.createElement('canvas');
const ink=layer.getContext('2d');
const stencil=document.createElement('canvas');
const shape=stencil.getContext('2d',{willReadFrequently:true});
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const mobile=matchMedia('(max-width:600px)');
let paused=reduced.matches, width, height, tiles=[], time=0, previous=null, frame=0;
const clamp=n=>Math.max(0,Math.min(1,n));
function ease(n){const x=clamp(n);return x*x*(3-2*x);}
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function build(){
  width=mobile.matches?900:1440;
  height=mobile.matches?720:600;
  for(const surface of [canvas,layer,stencil]){surface.width=width;surface.height=height;}
  const fontSize=mobile.matches?104:168;
  shape.font='900 '+fontSize+'px system-ui,sans-serif';
  shape.textAlign='center';
  shape.textBaseline='alphabetic';
  const word='GROWTHROVA';
  const bounds=shape.measureText(word);
  const baseline=(height+bounds.actualBoundingBoxAscent-bounds.actualBoundingBoxDescent)/2;
  shape.fillStyle='#fff';
  shape.fillText(word,width/2,baseline,width*.86);
  const pixels=shape.getImageData(0,0,width,height).data;
  tiles=[];
  for(let y=Math.floor(height*.34);y<height*.66;y+=9){
    for(let x=24;x<width-16;x+=34){
      let hits=0;
      for(const dx of [-12,0,12]){
        for(const dy of [-3,0,3]){
          if(pixels[((y+dy)*width+x+dx)*4+3]>128)hits++;
        }
      }
      if(!hits)continue;
      const seed=hash(x+y*width);
      tiles.push({x,y,seed,phase:hash(x*7+y*13),core:hits>=5});
    }
  }
  paint();
}
function paint(){
  ctx.clearRect(0,0,width,height);
  ink.clearRect(0,0,width,height);
  ink.textAlign='center';
  ink.textBaseline='middle';
  const pass=time%8;
  const maskFade=ease((pass-1.1)/1.4)*(1-ease((pass-5.25)/1.25));
  for(const tile of tiles){
    const {x,y,seed,phase,core}=tile;
    const progress=x/width;
    const pull=ease((pass-1.1-progress*.85)/1.45)*(1-ease((pass-4.2-progress*.68)/1.43));
    const drift=Math.sin(progress*9.5-pass*2.25+phase*.8);
    const sweep=Math.exp(-Math.pow((progress-(pass-.35)*.24)*8,2));
    const accent=seed>.97&&pull>.22;
    ink.globalAlpha=(.64+phase*.28)*(core?1:1-pull*.8);
    ink.fillStyle=accent?'#ff4cab':sweep>.55?'#fff':'#77d4ff';
    ink.font='700 '+(6+pull*(seed>.83?7:2)).toFixed(1)+'px monospace';
    const xx=x+pull*((x-width/2)*.08+(seed-.5)*89);
    const yy=y+pull*((y-height/2)*.94+drift*59+(phase-.5)*47);
    ink.fillText('growthrova',xx,yy);
  }
  ink.globalAlpha=1;
  if(maskFade<1){
    ctx.globalAlpha=1-maskFade;
    ctx.drawImage(layer,0,0);
    ctx.globalCompositeOperation='destination-in';
    ctx.drawImage(stencil,0,0);
    ctx.globalCompositeOperation='source-over';
  }
  ctx.globalAlpha=maskFade;
  ctx.drawImage(layer,0,0);
  ctx.globalAlpha=1;
}
function tick(now){
  if(previous!==null)time+=Math.min(.05,(now-previous)/1000);
  previous=now;paint();frame=requestAnimationFrame(tick);
}
function update(){
  cancelAnimationFrame(frame);
  previous=null;
  button.textContent=paused?'▶':'Ⅱ';
  button.setAttribute('aria-label',paused?'Play animation':'Pause animation');
  button.setAttribute('aria-pressed',String(paused));
  if(!paused)frame=requestAnimationFrame(tick);
}
button.addEventListener('click',()=>{paused=!paused;update();});
reduced.addEventListener('change',event=>{paused=event.matches;if(paused){time=0;paint();}update();});
mobile.addEventListener('change',build);
build();update();
</script>
</body>
</html>
